<header class="header">

  <div class="header-right">

    <!-- NOTIFICACIONES -->
    <button
      class="notification"
      type="button"
      aria-label="Notificaciones">

      <span>♧</span>
      <i></i>

    </button>


    <!-- USUARIO COMPLETO: TODO ES CLICKEABLE -->
    <a
      class="user"
      routerLink="/cliente/perfil"
      aria-label="Ir a mi perfil">

      <div class="avatar">
        {{ authService.getNombre().charAt(0).toUpperCase() || 'U' }}
      </div>

      <div class="user-info">

        <strong>
          {{ authService.getNombre() || 'Usuario' }}
        </strong>

        <span>
          {{ authService.getRol() || 'Usuario' }}
        </span>

      </div>

    </a>

  </div>

</header>
